[project]
name = "orca-assistant"
version = "0.3.0"
description = "Plain-language request -> validated ORCA input; run ORCA and parse results"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest"]
llm = ["anthropic>=0.40"]
plot = ["matplotlib>=3.5"]

[project.scripts]
orca-assistant = "orca_assistant.cli:main"
orca-parse = "orca_assistant.cli:parse_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
